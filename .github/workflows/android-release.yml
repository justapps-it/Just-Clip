name: Android release

# Publishes android/release/JustClip.apk (built and signed locally, see
# README) as a GitHub release whenever it changes. The tag is
# android-v<versionName> from android/app/build.gradle.kts.
on:
  push:
    paths:
      - android/release/JustClip.apk
      - .github/workflows/android-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version and checksum
        id: v
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          echo "tag=android-v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          sha256sum android/release/JustClip.apk | tee android/release/JustClip.apk.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: JustClip for Android ${{ steps.v.outputs.version }}
          make_latest: true
          files: |
            android/release/JustClip.apk
            android/release/JustClip.apk.sha256
          body: |
            **JustClip for Android** — automatic clips from Twitch lives, in the background.

            1. Download **JustClip.apk** below on your phone.
            2. Open it and allow installing from this source (Android 10 or newer).
            3. Pick a live Twitch channel and press *Start clipping in background*: clips are saved to *Movies/JustClip*.

            🇮🇹 Scarica **JustClip.apk** sul telefono, aprilo e consenti l'installazione da questa fonte. Le clip finiscono in *Movies/JustClip*.
